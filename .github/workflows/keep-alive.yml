name: Keep Alive

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours (3x within 12h sleep window)
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # allow the timestamp commit that keeps this workflow from being auto-disabled
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Selenium
        run: pip install selenium

      - name: Keep Streamlit app alive
        run: |
          python3 << 'EOF'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage")

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(120)

          try:
              print("Loading https://dtw-str.streamlit.app ...")
              driver.get("https://dtw-str.streamlit.app")
              time.sleep(15)

              # Check if the app is sleeping (wake-up button present)
              buttons = driver.find_elements(By.TAG_NAME, "button")
              wake_clicked = False
              for btn in buttons:
                  if "get this app back up" in btn.text.lower():
                      print("App is sleeping — clicking wake-up button...")
                      btn.click()
                      time.sleep(45)  # Wait for app container to restart
                      wake_clicked = True
                      break

              if not wake_clicked:
                  print("App is already awake")

              # Keep the browser open briefly to register as a viewer
              time.sleep(10)
              print(f"Page title: {driver.title}")
              print("Keep-alive successful!")
          except Exception as e:
              print(f"Keep-alive failed: {e}")
              raise
          finally:
              driver.quit()
          EOF

      - name: Bump keep-alive timestamp
        if: always()  # commit even if the ping step failed, so the workflow stays enabled
        # GitHub auto-disables scheduled workflows after 60 days with no repo
        # activity. Committing a timestamp each run resets that clock so this
        # workflow stays enabled indefinitely. (Pushes via GITHUB_TOKEN do not
        # re-trigger workflows, so this can't loop.)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keep-alive-timestamp
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keep-alive-timestamp
          git commit -m "chore: keep-alive timestamp [skip ci]"
          git push
